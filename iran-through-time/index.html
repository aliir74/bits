*{box-sizing:border-box}

.wrap{max-width:980px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 2px 12px}

.lang{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:999px;padding:5px 14px;font:inherit;font-size:13px;cursor:pointer}
.lang:hover{border-color:var(--acc)}
.lang.fa{font-family:Vazirmatn,Tahoma,sans-serif}
.map{position:relative;width:100%;border:1px solid var(--line);border-radius:14px;overflow:hidden}
svg{display:block;width:100%;height:auto}
.layer{transition:opacity .6s ease;will-change:opacity}.sea{fill:var(--bg)}
.oth path{fill:color-mix(in srgb,var(--fg) 7%,var(--bg));stroke:color-mix(in srgb,var(--fg) 30%,var(--bg));stroke-width:.6}
.hi{fill:color-mix(in srgb,var(--acc) 38%,var(--bg));stroke:var(--acc);stroke-width:1.4;stroke-linejoin:round}
.base{fill:none;stroke:color-mix(in srgb,var(--fg) 45%,transparent);stroke-width:.5;stroke-dasharray:2 2}
.lab{font-size:10px;fill:var(--mut);text-anchor:middle}
.hl{font-size:13px;font-weight:650;fill:var(--fg);text-anchor:middle}
:root[lang="fa"] .lab{font-size:11px}:root[lang="fa"] .hl{font-size:14px}
.lab,.hl{transition:transform .45s ease,opacity .35s ease}
.head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:14px 2px 4px}
.yr{font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ttl{font-size:17px;font-weight:600;color:var(--acc)}
.note{color:var(--mut);margin:0 2px 4px;min-height:1.5em}
.fix{font-size:12px;color:var(--warn);margin:0 2px 10px;min-height:1.5em}.fix a{color:inherit}
[dir="rtl"] p{text-align:justify}
.row{display:flex;align-items:center;gap:10px;margin-top:4px}.tl{position:relative;flex:1;min-width:0}
.play{flex:0 0 40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;display:grid;place-items:center;padding:0}
.play:hover{border-color:var(--acc)}.play svg{width:14px;height:14px;fill:currentColor}
.strip{overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;cursor:grab;-webkit-overflow-scrolling:touch}
.strip::-webkit-scrollbar{display:none}.strip.drag{cursor:grabbing;scroll-snap-type:none}
.track{display:flex;width:max-content;padding:0 calc(50% - 32px)}
.tick{flex:0 0 64px;scroll-snap-align:center;text-align:center;padding:26px 0 6px;position:relative;color:var(--mut);font-size:11px;user-select:none;font-variant-numeric:tabular-nums;white-space:nowrap}
.tick:before{content:"";position:absolute;left:50%;top:6px;height:14px;border-left:1px solid var(--line)}
.tick.on{color:var(--fg);font-weight:650}.tick.on:before{border-color:var(--acc);border-width:2px;height:18px;top:4px}
.needle{position:absolute;left:50%;top:0;height:24px;border-left:2px solid var(--fg);transform:translateX(-1px);pointer-events:none}
.hint{color:var(--mut);font-size:12px;text-align:center;margin-top:2px}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:10px 2px 0}
.key i{display:inline-block;width:14px;height:10px;border-radius:2px;margin-inline-end:6px;vertical-align:-1px}
.foot{font-size:11px;color:var(--mut);margin:12px 2px 0}.foot a{color:inherit}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.layer,.lab,.hl{transition:none!important}}
